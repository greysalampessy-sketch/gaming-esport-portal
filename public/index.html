<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESPORT SGA - Portal Resmi Game & Esport Indonesia</title>
  <meta name="description" content="ESPORT SGA adalah portal resmi informasi katalog game, jadwal pertandingan, hasil skor, dan profil tim esport terlengkap untuk komunitas gaming Indonesia." />
  <meta name="keywords" content="esport sga, portal esport, jadwal esport, hasil pertandingan esport, katalog game, tim esport, mobile legends, valorant, dota 2, csgo" />
  <meta property="og:title" content="ESPORT SGA - Portal Resmi Game & Esport Indonesia" />
  <meta property="og:description" content="Katalog game, jadwal pertandingan, hasil skor live, dan profil tim esport terlengkap dalam satu platform." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
</head>
<body>
  <div class="topbar">
    <img src="logo-wordmark.png" alt="ESPORT SGA" class="brand-logo" />
    <p>Portal resmi katalog game, jadwal pertandingan, hasil skor, dan profil tim esport terpercaya</p>
    <div class="tabs">
      <button class="tab-btn active" data-tab="games">🎮 Katalog Game</button>
      <button class="tab-btn" data-tab="esports">🏆 Pertandingan</button>
      <button class="tab-btn" data-tab="teams">🛡️ Tim Esport</button>
      <button class="tab-btn" data-tab="favorites">⭐ Favorit</button>
    </div>
  </div>

  <div class="container">

    <div id="games-view" class="view active">
      <div class="toolbar">
        <div class="search-box">
          <input id="searchInput" type="text" placeholder="Cari game... (contoh: Mobile Legends, Valorant)" />
        </div>
        <select id="sortSelect" class="sort-select">
          <option value="">Urutkan: Relevansi</option>
          <option value="-rating">Rating Tertinggi</option>
          <option value="-released">Terbaru</option>
          <option value="name">Nama A-Z</option>
        </select>
      </div>
      <div class="chip-group" id="platformChips">
        <button class="chip active" data-platform="">Semua</button>
        <button class="chip" data-platform="4">PC</button>
        <button class="chip" data-platform="187">PlayStation 5</button>
        <button class="chip" data-platform="1">Xbox Series</button>
        <button class="chip" data-platform="3">iOS</button>
        <button class="chip" data-platform="21">Android</button>
        <button class="chip" data-platform="7">Nintendo Switch</button>
      </div>
      <p id="gamesStatus" class="status-text">Memuat data game...</p>
      <div id="gamesGrid" class="grid"></div>
      <div class="load-more-wrap">
        <button id="loadMoreBtn" class="load-more-btn">Muat Lebih Banyak</button>
      </div>
    </div>

    <div id="esports-view" class="view">
      <div class="esport-pills" id="gamePills">
        <button class="chip active" data-game="lol">League of Legends</button>
        <button class="chip" data-game="dota2">Dota 2</button>
        <button class="chip" data-game="csgo">CS:GO</button>
        <button class="chip" data-game="valorant">Valorant</button>
        <button class="chip" data-game="mobilelegends">Mobile Legends: Bang Bang</button>
      </div>
      <div class="chip-group" id="statusPills" style="margin-bottom:18px;">
        <button class="chip" data-status="running">🔴 Sedang Berlangsung</button>
        <button class="chip active" data-status="upcoming">📅 Mendatang</button>
        <button class="chip" data-status="past">✅ Hasil Selesai</button>
      </div>
      <p id="matchesStatus" class="status-text">Memuat jadwal pertandingan...</p>
      <div id="matchesList" class="match-list"></div>
    </div>

    <div id="teams-view" class="view">
      <div class="esport-pills" id="teamGamePills">
        <button class="chip active" data-game="lol">League of Legends</button>
        <button class="chip" data-game="dota2">Dota 2</button>
        <button class="chip" data-game="csgo">CS:GO</button>
        <button class="chip" data-game="valorant">Valorant</button>
        <button class="chip" data-game="mobilelegends">Mobile Legends: Bang Bang</button>
      </div>
      <p id="teamsStatus" class="status-text">Memuat daftar tim...</p>
      <div id="teamsGrid" class="team-grid"></div>
    </div>

    <div id="favorites-view" class="view">
      <p id="favoritesStatus" class="status-text">Game favorit Anda</p>
      <div id="favoritesGrid" class="grid"></div>
    </div>

  </div>

  <div class="modal-overlay" id="gameModal">
    <div class="modal-box">
      <div class="modal-inner">
        <button class="modal-close" id="modalClose">✕</button>
        <img id="modalImage" src="" alt="" />
        <div class="modal-body">
          <h2 id="modalTitle"></h2>
          <div class="meta-row">
            <span>⭐ <strong id="modalRating"></strong></span>
            <span>📅 Rilis: <strong id="modalReleased"></strong></span>
            <span>🎮 Platform: <strong id="modalPlatforms"></strong></span>
          </div>
          <p id="modalDescription">Memuat deskripsi...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
