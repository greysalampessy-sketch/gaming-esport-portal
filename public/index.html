<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESPORT SGA - Portal Resmi Esport Indonesia</title>
  <meta name="description" content="ESPORT SGA adalah portal resmi informasi jadwal pertandingan Mobile Legends, PUBG, Valorant, hasil skor, dan profil tim esport terlengkap untuk komunitas gaming Indonesia." />
  <meta name="keywords" content="esport sga, portal esport indonesia, jadwal mobile legends, mpl indonesia, jadwal esport, hasil pertandingan esport, tim esport, mobile legends, valorant, pubg, dota 2" />
  <meta property="og:title" content="ESPORT SGA - Portal Resmi Esport Indonesia" />
  <meta property="og:description" content="Jadwal pertandingan Mobile Legends & PUBG, hasil skor live, dan profil tim esport terlengkap dalam satu platform." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-row">
      <img src="logo-wordmark.png" alt="ESPORT SGA" class="brand-logo" />
      <button id="themeToggle" class="theme-toggle" title="Ganti tema">🌙</button>
    </div>
    <p>Portal resmi jadwal pertandingan, hasil skor, dan profil tim esport untuk komunitas gaming Indonesia</p>
    <div class="tabs">
      <button class="tab-btn active" data-tab="esports">🏆 Pertandingan</button>
      <button class="tab-btn" data-tab="teams">🛡️ Tim Esport</button>
    </div>
  </div>

  <div class="container">

    <div id="esports-view" class="view active">
      <div class="esport-pills" id="gamePills">
        <button class="chip active" data-game="mlbb">Mobile Legends: Bang Bang</button>
        <button class="chip" data-game="pubg">PUBG</button>
        <button class="chip" data-game="valorant">Valorant</button>
        <button class="chip" data-game="lol-wild-rift">LoL: Wild Rift</button>
        <button class="chip" data-game="dota-2">Dota 2</button>
        <button class="chip" data-game="cs-go">Counter-Strike</button>
      </div>
      <div class="chip-group" id="statusPills" style="margin-bottom:18px;">
        <button class="chip" data-status="running">🔴 Sedang Berlangsung</button>
        <button class="chip active" data-status="upcoming">📅 Mendatang</button>
        <button class="chip" data-status="past">✅ Hasil Selesai</button>
      </div>
      <p id="matchesStatus" class="status-text">Memuat jadwal pertandingan...</p>
      <div id="matchesList" class="match-list"></div>
    </div>

    <div id="teams-view" class="view">
      <div class="esport-pills" id="teamGamePills">
        <button class="chip active" data-game="mlbb">Mobile Legends: Bang Bang</button>
        <button class="chip" data-game="pubg">PUBG</button>
        <button class="chip" data-game="valorant">Valorant</button>
        <button class="chip" data-game="lol-wild-rift">LoL: Wild Rift</button>
        <button class="chip" data-game="dota-2">Dota 2</button>
        <button class="chip" data-game="cs-go">Counter-Strike</button>
      </div>
      <p id="teamsStatus" class="status-text">Memuat daftar tim...</p>
      <div id="teamsGrid" class="team-grid"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
